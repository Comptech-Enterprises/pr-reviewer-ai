# LLM Model Pricing Configuration
# Prices are per 1,000 tokens (as of early 2025)
# Update these values as pricing changes

# OpenAI Models
openai:
  gpt-4:
    input: 0.03
    output: 0.06
    description: "Original GPT-4 model"
  gpt-4-turbo:
    input: 0.01
    output: 0.03
    description: "GPT-4 Turbo with 128K context"
  gpt-4o:
    input: 0.005
    output: 0.015
    description: "GPT-4o multimodal model"
  gpt-4o-mini:
    input: 0.00015
    output: 0.0006
    description: "Cost-effective GPT-4o mini"
  gpt-3.5-turbo:
    input: 0.0005
    output: 0.0015
