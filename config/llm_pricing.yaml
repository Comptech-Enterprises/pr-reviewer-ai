# Default pricing for unknown models
default:
  unknown:
    input: 0.002
    output: 0.006
    description: "Default fallback pricing"

# Cost estimation settings
estimation:
  # Average tokens per API call (for estimation)
  avg_input_tokens: 1000
  avg_output_tokens: 500
  
  # Risk thresholds (cost per call)
  low_cost_threshold: 0.01
  medium_cost_threshold: 0.05
  high_cost_threshold: 0.10
